<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dots &amp; Boxes 3D</title>
  <meta name="description" content="Privacy Policy and Terms of Use for Dots and Boxes 3D.">
  <style>
    :root {
      --navy: #090e1a;
      --card: rgba(18, 28, 48, 0.86);
      --line: rgba(148, 180, 220, 0.22);
      --text: #f8fafc;
      --muted: #9aabc4;
      --cyan: #06e5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(6, 229, 245, 0.16), transparent 55%),
        var(--navy);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px;
    }
    img { width: 84px; height: 84px; border-radius: 22px; }
    h1 { margin: 18px 0 8px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; }
    ul { padding: 0; list-style: none; }
    li { margin: 10px 0; }
    a { color: var(--cyan); }
    .card {
      margin-top: 24px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" width="84" height="84" alt="Dots and Boxes 3D logo">
    <h1>Dots &amp; Boxes 3D</h1>
    <p>An offline casual puzzle game for Android. Game progress stays on the device. These pages describe how the app is used and how advertising works.</p>
    <div class="card">
      <ul>
        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="terms.html">Terms of Use</a></li>
      </ul>
      <p>Contact: <a href="mailto:tutorialspointexamples@gmail.com">tutorialspointexamples@gmail.com</a></p>
    </div>
  </main>
</body>
</html>
